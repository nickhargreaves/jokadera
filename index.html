<!DOCTYPE html>

<html>
<head>
    <meta name="viewport" content="width=device-width" />
    <title>JoKadera Family Tree</title>
    <style id="myStyles">
        html, body {
    margin: 0px;
    padding: 0px;
    width: 100%;
    height: 100%;
    font-family: Helvetica;
    overflow: hidden;
}

#tree {
    width: 100%;
    height: 100%;
}

/*partial*/
[lcn='silvanus']>rect {
    fill: #FFCA28;
}

[lcn='Fransisca']>rect {
    fill: #F57C00;
}

[lcn='level1']>rect {
    fill: #f2f2f2;
}

[lcn='level1']>text,
.assistant>text {
    fill: #aeaeae;
}

[lcn='level1'] circle,
[lcn='assistant'] {
    fill: #aeaeae;
}

.assistant>rect {
    fill: #ffffff;
}

.assistant [control-node-menu-id]>circle {
    fill: #aeaeae;
}

.mary>rect {
    fill: #b4ffff;
}

.mary>text {
    fill: #039BE5;
}

.mary>[control-node-menu-id] line {
    stroke: #039BE5;
}

.mary>g>.ripple {
    fill: #00efef;
}

.silvanus>rect {
    fill: #fff5d8;
}

.silvanus>text {
    fill: #ecaf00;
}

.silvanus>[control-node-menu-id] line {
    stroke: #ecaf00;
}

.silvanus>g>.ripple {
    fill: #ecaf00;
}

.Fransisca>rect {
    fill: #ffeedd;
}

.Fransisca>text {
    fill: #F57C00;
}

.Fransisca>[control-node-menu-id] line {
    stroke: #F57C00;
}

.Fransisca>g>.ripple {
    fill: #F57C00;
}


    </style>

</head>
<body>
    
<script src="https://balkangraph.com/js/latest/OrgChart.js"></script>

<div id="tree"></div>
    <script>
    

window.onload = function () {
    OrgChart.templates.ana.plus = '<circle cx="15" cy="15" r="15" fill="#ffffff" stroke="#aeaeae" stroke-width="1"></circle>'
        + '<text text-anchor="middle" style="font-size: 18px;cursor:pointer;" fill="#757575" x="15" y="22">{collapsed-children-count}</text>';

    OrgChart.templates.invisibleGroup.padding = [20, 0, 0, 0];

    var chart = new OrgChart(document.getElementById("tree"), {
        template: "ana",
        enableDragDrop: true,
        assistantSeparation: 170,
        menu: {
            pdfPreview: {
                text: "Export to PDF",
                icon: OrgChart.icon.pdf(24, 24, '#7A7A7A'),
                onClick: preview
            },
            csv: { text: "Save as CSV" }
        },
        nodeMenu: {
        },
        align: OrgChart.ORIENTATION,
        toolbar: {
            fullScreen: true,
            zoom: true,
            fit: true,
            expandAll: false
        },
        nodeBinding: {
            field_0: "name",
            field_1: "title",
            img_0: "img"
        },
        tags: {
            "level1": {
                template: "invisibleGroup",
                subTreeConfig: {
                    orientation: OrgChart.orientation.bottom,
                    collapse: {
                        level: 1
                    }
                }
            },
            "mary": {
                subTreeConfig: {
                    layout: OrgChart.mixed,
                    collapse: {
                        level: 1
                    }
                },
            },
            "silvanus": {
                subTreeConfig: {
                    layout: OrgChart.treeRightOffset,
                    collapse: {
                        level: 1
                    }
                },
            },
            "Fransisca": {
                subTreeConfig: {
                    layout: OrgChart.treeLeftOffset,
                    collapse: {
                        level: 1
                    }
                },
            },
            "seo-menu": {
                nodeMenu: {
                }
            },
            "menu-without-add": {
                nodeMenu: {}
            },
            "department": {
                template: "group",
                nodeMenu: {}
            }
        }
    });

    chart.on("added", function (sender, id) {
        sender.editUI.show(id);
    });

    chart.on('drop', function (sender, draggedNodeId, droppedNodeId) {
        var draggedNode = sender.getNode(draggedNodeId);
        var droppedNode = sender.getNode(droppedNodeId);

        if (droppedNode.tags.indexOf("department") != -1 && draggedNode.tags.indexOf("department") == -1) {
            var draggedNodeData = sender.get(draggedNode.id);
            draggedNodeData.pid = null;
            draggedNodeData.stpid = droppedNode.id;
            sender.updateNode(draggedNodeData);
            return false;
        }
    });

    chart.editUI.on('field', function (sender, args) {
        var isDeprtment = sender.node.tags.indexOf("department") != -1;
        var deprtmentFileds = ["name"];

        if (isDeprtment && deprtmentFileds.indexOf(args.name) == -1) {
            return false;
        }
    });

    chart.on('exportstart', function (sender, args) {
        args.styles = document.getElementById('myStyles').outerHTML;
    });

    chart.load([
        { id: "level1", tags: ["level1"] },
        { id: "silvanus", pid: "level1", tags: ["silvanus", "department"]},
        { id: "mary", pid: "level1", tags: ["mary", "department"]},
        { id: "fransisca", pid: "level1", tags: ["fransisca", "department"]},
        { id: "julita", pid: "level1", tags: ["julita", "department"]},
        { id: "esther", pid: "level1", tags: ["esther", "department"]},
        { id: "charles", pid: "level1", tags: ["charles", "department"]},
        { id: "gaudensia", pid: "level1", tags: ["gaudensia", "department"]},
        { id: "rose", pid: "level1", tags: ["rose", "department"]},

        { id: 1, stpid: "level1", name: "Jim Adera", title: "Kwara", img: "img/adera.gif", tags: ["seo-menu"] },
        { id: 2, stpid: "level1", name: "Suzzana Nyamolo", title: "Dani", img: "img/dani.jpg", tags: ["seo-menu"] },

        { id: 3, pid: 1, name: "Otieno", title: "Adam", img: "img/default.png", tags: ["menu-without-add"] },

        { id: 5, stpid: "silvanus", name: "Silvan", title: "1st born", img: "img/default.png" },
        { id: 12, stpid: "mary", name: "Mary", title: "2nd born", img: "img/default.png" },
        { id: 13, stpid: "fransisca", name: "Fransisca", title: "3rd born", img: "img/default.png" },
        { id: 17, stpid: "julita", name: "Julita", title: "4th born", img: "img/default.png" },
        { id: 14, stpid: "esther", name: "Esther", title: "5th born", img: "img/default.png" },
        { id: 15, stpid: "charles", name: "Charles", title: "6th born", img: "img/default.png" },
        { id: 16, stpid: "gaudensia", name: "Gaudensia", title: "7th born", img: "img/default.png" },

        { id: 6, stpid: "rose", name: "Rose", title: "Last born", img: "img/default.png" },
        { id: 7, pid: 6, name: "Nick", title: "1st born", img: "img/default.png" },
        { id: 8, pid: 6, name: "Lillian", title: "2nd born", img: "img/default.png" },
        { id: 9, pid: 6, name: "Felix", title: "3rd born", img: "img/default.png" },
        { id: 10, pid: 6, name: "Maxwell", title: "4th born", img: "img/default.png" },
        { id: 11, pid: 6, name: "Marianne", title: "last born", img: "img/default.png" },

    ]);

    function preview() {
        OrgChart.pdfPrevUI.show(chart, {
            format: 'A4'
        });
    }

    function nodePdfPreview(nodeId) {
        OrgChart.pdfPrevUI.show(chart, {
            format: 'A4',
            nodeId: nodeId
        });
    }

    function addSharholder(nodeId) {
        chart.addNode({ id: OrgChart.randomId(), pid: nodeId, tags: ["menu-without-add"] });
    }

    function addAssistant(nodeId) {
        var node = chart.getNode(nodeId);
        var data = { id: OrgChart.randomId(), pid: node.stParent.id, tags: ["assistant"] };
        chart.addNode(data);
    }


    function addDepartment(nodeId) {
        var node = chart.getNode(nodeId);
        var data = { id: OrgChart.randomId(), pid: node.stParent.id, tags: ["department"] };
        chart.addNode(data);
    }

    function addManager(nodeId) {
        chart.addNode({ id: OrgChart.randomId(), stpid: nodeId });
    }
};

    </script>
</body>
</html>
